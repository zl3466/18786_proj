### Qwen2.5-3B ChatGPT-format SFT (ShareGPT jsonl)
# Data: train/dataset_info.json → sql_chatgpt → ../data/train_sql_chatgpt.jsonl
# Run from project root so dataset_dir: train resolves to ./train/

### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 32
lora_dropout: 0.1
quantization_bit: 4
quantization_type: nf4

### dataset
dataset: sql_chatgpt
dataset_dir: train
template: default
cutoff_len: 2048
overwrite_cache: false
preprocessing_num_workers: 16

### output
output_dir: ./qwen-base-chatgpt-qlora-adapter
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### logging (Weights & Biases)
# WANDB_ENTITY=... WANDB_PROJECT=... llamafactory-cli train train/qwen_base_llamafactory.yaml
report_to: wandb
run_name: qwen3b-chatgpt-qlora-3000

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 3.0
max_steps: 3000
max_grad_norm: 0.3
fp16: true
optim: paged_adamw_32bit
group_by_length: true

### eval
val_size: 0.0
eval_strategy: "no"
